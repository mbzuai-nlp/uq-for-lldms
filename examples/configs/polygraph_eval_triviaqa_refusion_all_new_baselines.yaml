hydra:
  run:
    dir: ${cache_path}/${task}/${model.path}/${dataset}/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - model: refusion
  - estimators: all_estimators_llada_new_baselines
  - stat_calculators: new_calculators_llada_new_baselines
  - base_processing_triviaqa
  - _self_

cache_path: ./workdir/output_refusion_all_new_baselines
save_path: '${hydra:run.dir}'
instruct: true
task: qa

dataset: ['LM-Polygraph/triviaqa', 'simple_instruct']
text_column: input
label_column: output
train_split: train
eval_split: test
max_new_tokens: 20
load_from_disk: false
multiref: true
trust_remote_code: true
size: null
generation_params:
  stop_strings:
    - "\n"

subsample_eval_dataset: -1

generation_metrics: null

ignore_exceptions: false

batch_size: 1

seed:
  - 1

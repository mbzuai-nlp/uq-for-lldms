- auto
- name: EmbeddingsCalculator
  builder: lm_polygraph.defaults.stat_calculator_builders.default_Embeddings
  cfg:
    embeddings_level: "sequence"
  stats:
    - "embeddings"
  dependencies:
    - "embeddings_raw"
- name: TokenEmbeddingsCalculator
  builder: lm_polygraph.defaults.stat_calculator_builders.default_Embeddings
  cfg:
    embeddings_level: "token"
  stats:
    - "token_embeddings"
  dependencies:
    - "embeddings_raw"
- name: LookbackRatioCalculator
  builder: lm_polygraph.defaults.stat_calculator_builders.default_Attentions
  cfg:
    attentions: "lookback_ratio"
  stats:
    - "lookback_ratios"
  dependencies:
    - "attention_raw"
- name: AttentionFeaturesCalculator
  builder: lm_polygraph.defaults.stat_calculator_builders.default_Attentions
  cfg:
    attentions: "attention_features"
  stats:
    - "attention_features"
  dependencies:
    - "attention_raw"
- name: MCMaskedLLCalculator
  builder: calculators.mc_masked_ll_builder
  cfg:
    mc_num: 16
  stats:
    - "mc_masked_ll"
    - "mc_masked_normalized_ll"
  dependencies:
    - "greedy_texts"
- name: SampleMCMaskedLLCalculator
  builder: calculators.sample_mc_masked_ll_builder
  cfg:
    mc_num: 16
  stats:
    - "sample_mc_masked_ll"
    - "sample_mc_masked_normalized_ll"
  dependencies:
    - "sample_texts"
- name: BlockMCMaskedLLCalculator
  builder: calculators.block_mc_masked_ll_builder
  cfg:
    block_size: 32
    mc_num: 16
    seed: 42
  stats:
    - "block_mc_masked_ll"
    - "block_mc_masked_normalized_ll"
  dependencies:
    - "greedy_texts"
- name: DiffusionGreedyProbsCalculator
  builder: calculators.diffusion_greedy_probs_builder
  cfg:
    output_diffusion_stats: True
  stats:
    - "input_texts"
    - "input_tokens"
    - "greedy_log_probs"
    - "greedy_tokens"
    - "greedy_tokens_alternatives"
    - "greedy_texts"
    - "greedy_log_likelihoods"
    - "embeddings_raw"
    - "attention_raw"
    - "tokenizer"
    - "nfe"
    - "remask_count"
    - "first_remask_step"
    - "generation_trace"
    - "full_generation_trace"
    - "last_block_generation_trace"
    - "block_generation_traces"
    - "gen_trace_logits"
    - "gen_trace_entropy"
  dependencies: []
- name: SemanticMatrixTraceCalculator
  builder: calculators.semantic_matrix_trace_builder
  cfg:
    nli_model:
      deberta_path: "microsoft/deberta-large-mnli"
      hf_cache: null
      batch_size: 10
      device: cuda
  stats:
    - "semantic_matrix_entail_trace"
    - "semantic_matrix_contra_trace"
    - "semantic_matrix_classes_trace"
    - "semantic_matrix_entail_logits_trace"
    - "semantic_matrix_contra_logits_trace"
    - "entailment_id"
  dependencies:
    - "generation_trace"
- name: GreedyCrossEncoderSimilarityMatrixTraceCalculator
  builder: calculators.greedy_cross_encoder_similarity_trace_builder
  cfg:
  stats:
    - "greedy_sentence_similarity_forward_trace"
    - "greedy_sentence_similarity_backward_trace"
    - "greedy_sentence_similarity_trace"
  dependencies:
    - "input_texts"
    - "generation_trace"
    - "greedy_texts"
- name: GreedyCrossEncoderSimilarityMatrixFullTraceCalculator
  builder: calculators.greedy_cross_encoder_similarity_full_trace_builder
  cfg:
  stats:
    - "greedy_sentence_similarity_forward_full_trace"
    - "greedy_sentence_similarity_backward_full_trace"
    - "greedy_sentence_similarity_full_trace"
  dependencies:
    - "input_texts"
    - "full_generation_trace" # changed from "generation_trace"
    - "greedy_texts"
- name: GreedyCrossEncoderSimilarityMatrixLastBlockTraceCalculator
  builder: calculators.greedy_cross_encoder_similarity_last_block_trace_builder
  cfg:
  stats:
    - "greedy_sentence_similarity_last_block_forward_trace"

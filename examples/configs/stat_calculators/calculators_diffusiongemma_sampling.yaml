    - "greedy_texts"
- name: GreedyDebertaSimilarityMatrixBlockTraceCalculator
  builder: calculators.greedy_deberta_similarity_block_trace_builder
  cfg:
    nli_model:
      deberta_path: "microsoft/deberta-large-mnli"
      hf_cache: null
      batch_size: 10
      device: cuda
  stats:
    - "greedy_deberta_entail_block_forward"
    - "greedy_deberta_entail_block_backward"
    - "greedy_deberta_entail_block"
    - "greedy_deberta_contra_block_forward"
    - "greedy_deberta_contra_block_backward"
    - "greedy_deberta_contra_block"
  dependencies:
    - "block_generation_traces"
- name: GreedyDebertaSimilarityMatrixLastBlockTraceCalculator
  builder: calculators.greedy_deberta_similarity_last_block_trace_builder
  cfg:
    nli_model:
      deberta_path: "microsoft/deberta-large-mnli"
      hf_cache: null
      batch_size: 10
      device: cuda
  stats:
    - "greedy_deberta_entail_last_block_forward_trace"
    - "greedy_deberta_entail_last_block_backward_trace"
    - "greedy_deberta_entail_last_block_trace"
    - "greedy_deberta_contra_last_block_forward_trace"
    - "greedy_deberta_contra_last_block_backward_trace"
    - "greedy_deberta_contra_last_block_trace"
  dependencies:

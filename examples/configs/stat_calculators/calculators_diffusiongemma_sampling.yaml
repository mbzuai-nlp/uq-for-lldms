# ---------------------------------------------------------------- sampling path
- name: DiffusionGemmaSamplingGenerationCalculator
  builder: calculators.diffusiongemma_sample_builder
  cfg:
    samples_n: 10
    # null = use the model's native sampling (random canvas init + renoising), which keeps
    # the sampled decodes on the same decoding distribution as the greedy run. Set a float
    # only for a deliberate diversity ablation; T=2.0 produces word salad.
    sample_temperature: null
  stats:
    - "sample_log_probs"
    - "sample_log_likelihoods"
    - "sample_tokens"
    - "sample_texts"
  dependencies: []

# The semantic-matrix, semantic-classes and greedy-vs-sample similarity calculators are
# resolved by the `- auto` entry at the top of this file: lm-polygraph discovers them from
# its own registry once `sample_texts` is available. Declaring them by hand fails, because
# not every built-in calculator has a `default_<Name>` builder module (SemanticClasses does
# not). The explicit DiffusionGemmaSamplingGenerationCalculator entry above still takes
# precedence over the built-in SamplingGenerationCalculator for `sample_texts`, the same way
# DiffusionGemmaGreedyProbsCalculator overrides the built-in greedy calculator.

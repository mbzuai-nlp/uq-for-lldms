- name: AttentionFeaturesCalculator
  builder: lm_polygraph.defaults.stat_calculator_builders.default_Attentions
  cfg:
    attentions: "attention_features"
  stats:
    - "attention_features"
  dependencies:
    - "attention_raw"
- name: DiffusionGreedyProbsCalculator
  builder: calculators.diffusion_greedy_probs_builder
  cfg:
    output_attentions: True
    output_hidden_states: True
    output_diffusion_stats: True
    output_token_embeddings: True
    hidden_state_layer: "middle"
  stats:
    - "input_texts"
    - "input_tokens"
    - "input_embeddings_mean"
    - "greedy_tokens"
    - "greedy_texts"
    - "greedy_log_likelihoods"
    - "attention_raw"
    - "tokenizer"
    - "gen_trace_entropy"
    - "gen_trace_argmax"
    - "gen_trace_embeddings"
    - "nfe"
    - "full_generation_trace"
    - "block_generation_traces"
    - "confidence_at_commit"
  dependencies: []
- name: PromptCalculator
  builder: lm_polygraph.utils.builder_stat_calculator_simple
  cfg:
    obj: PromptCalculator
  stats:
    - "p_true"
  dependencies:
    - "greedy_texts"
- name: DiffusionTrainingStatisticExtractionCalculator
  builder: calculators.diffusion_training_stats_builder
  cfg:
    dataset: '${dataset}'
    text_column: '${text_column}'
    label_column: '${label_column}'
    description: ''
    prompt: ''
    few_shot_split: "train"
    train_split: '${train_split}'
    load_from_disk: '${load_from_disk}'
    subsample_train_dataset: -1
    n_shot: 5
    batch_size: '${batch_size}'
    seed: '${seed}'
    size: null
    output_attentions: True
    output_hidden_states: True
    output_diffusion_stats: True
    output_token_embeddings: True
    hidden_state_layer: "middle"
    return_attention_features: True
    target_metric: "Accuracy"
  stats:
    - "train_greedy_texts"
    - "train_input_tokens"
    - "train_input_embeddings_mean"
    - "train_greedy_tokens"
    - "train_greedy_log_likelihoods"
    - "train_gen_trace_entropy"
    - "train_gen_trace_argmax"
    - "train_gen_trace_embeddings"
    - "train_attention_features"
    - "train_metrics"
  dependencies: []
- auto
- name: MCMaskedLLCalculator
  builder: calculators.mc_masked_ll_builder
  cfg:
    mc_num: 16
  stats:
    - "mc_masked_ll"
    - "mc_masked_normalized_ll"
  dependencies:
    - "greedy_texts"
- name: GreedyCrossEncoderSimilarityMatrixFullTraceCalculator
  builder: calculators.greedy_cross_encoder_similarity_full_trace_builder
  cfg:
  stats:
    - "greedy_sentence_similarity_forward_full_trace"
    - "greedy_sentence_similarity_backward_full_trace"
    - "greedy_sentence_similarity_full_trace"
  dependencies:
    - "input_texts"
    - "full_generation_trace"
    - "greedy_texts"
- name: GreedyCrossEncoderSimilarityMatrixBlockTraceCalculator
  builder: calculators.greedy_cross_encoder_similarity_block_trace_builder
  cfg:
  stats:
    - "greedy_sentence_similarity_block_forward"
    - "greedy_sentence_similarity_block_backward"
    - "greedy_sentence_similarity_block"
  dependencies:
    - "block_generation_traces"
